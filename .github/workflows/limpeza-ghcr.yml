name: limpeza-ghcr

# Limpeza das versões da imagem `ghcr.io/viralabs-dev/brabo-web` no GHCR (AT-765).
# - PR fechada (para a `dev`, ou `hotfix/*` para a `main`): apaga a versão `sha-<12>` de cada commit da PR (AT-769).
# - Diário: guarda as 10 tags `-dev.N` mais novas e apaga as demais; rede de segurança: apaga `sha-*` com mais de 7 dias (as órfãs de force-push).
# Nunca apaga versão que tenha tag `vX.Y.Z` sem sufixo.
on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  pull-requests: read # listar os commits da PR
  packages: write # apagar versões do pacote: o DELETE exige que este repo tenha o papel Admin no pacote (Package settings > Manage Actions access)

env:
  PACOTE: brabo-web
  GH_TOKEN: ${{ github.token }}

jobs:
  sha-da-pr:
    name: Apagar os sha- da PR fechada
    if: github.event_name == 'pull_request' && (github.base_ref == 'dev' || (github.base_ref == 'main' && startsWith(github.head_ref, 'hotfix/'))) && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # cada push na PR cria um sha-<12>; apaga o de todos os commits dela
          tags=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/commits" --jq '.[].sha | "sha-" + .[0:12]' | jq -R . | jq -sc .)
          gh api --paginate "orgs/viralabs-dev/packages/container/${PACOTE}/versions" \
            | jq -r --argjson t "$tags" '.[] | select(any(.metadata.container.tags[]; . as $x | $t | index($x))) | select(all(.metadata.container.tags[]; test("^v[0-9]+\\.[0-9]+\\.[0-9]+$") | not)) | .id' \
            | while read -r id; do
                echo "apagando versão ${id}"
                gh api -X DELETE "orgs/viralabs-dev/packages/container/${PACOTE}/versions/${id}"
              done

  limpeza-diaria:
    name: Guardar só as 10 -dev mais novas e varrer sha- antigos
    if: github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - run: |
          set -euo pipefail
          corte=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "orgs/viralabs-dev/packages/container/${PACOTE}/versions" \
            | jq -rs --arg corte "$corte" 'add
                | map(select(all(.metadata.container.tags[]; test("^v[0-9]+\\.[0-9]+\\.[0-9]+$") | not))) as $v
                | ($v | map(select(any(.metadata.container.tags[]; test("^v[0-9]+\\.[0-9]+\\.[0-9]+-dev\\.[0-9]+$")))) | sort_by(.created_at) | reverse | .[10:]) as $dev
                | ($v | map(select(any(.metadata.container.tags[]; test("^sha-")) and .created_at < $corte))) as $sha
                | ($dev + $sha)[] | .id' \
            | while read -r id; do
                echo "apagando versão ${id}"
                gh api -X DELETE "orgs/viralabs-dev/packages/container/${PACOTE}/versions/${id}"
              done
