name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26.10.0'
  PNPM_VERSION: '11.3.0'

jobs:
  web:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Os tipos da api vêm da spec FIXADA em fixados/openapi.json (ver fixados/ORIGEM.md).
      - run: pnpm openapi:types:check
      - run: pnpm typecheck
      - run: pnpm areas:baixar
      - run: pnpm exec vitest run --maxWorkers=2
      - run: pnpm exec vite build

  imagem:
    name: Imagem de produção (sem publicar)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f Dockerfile -t brabo-web:ci .
