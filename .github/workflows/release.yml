name: release

# Release por TAG da imagem `ghcr.io/viralabs-dev/brabo-web` (AT-704, ADR 0252).
# A tag final (vX.Y.Z) nasce do `carimbo.yml` (tag-release do brabo-ci) quando o dono
# promove dev->main; este workflow reage a ela: constrói, publica por digest, escaneia
# o DIGEST (Trivy, as flags do monorepo), assina keyless por DIGEST e verifica no mesmo
# run. O `imagem.json` anexado à Release é o que o `brabo` lê para montar o `images.json`.
# A tag `-dev.N` (carimbo da dev, AT-765) também publica, escaneia e assina, mas NÃO cria Release: o `imagem.json` vai como artefato do run.
# `workflow_dispatch` numa BRANCH é o ENSAIO (constrói e escaneia local, NÃO publica nem assina); numa TAG (disparado pelo carimbo.yml) publica.
# Molde repetido nos quatro repos de imagem; candidato a reutilizável do brabo-ci.
# O run se nomeia pela origem (AT-773, RN-1044) e o primeiro passo escreve os Vínculos (a origem sai da linha `Carimbo:` da tag).
run-name: >-
  ${{ github.event_name == 'push' && format('release {0} ← tag do carimbo', github.ref_name)
    || github.event_name == 'pull_request' && format('release (ensaio) ← #{0}', github.event.pull_request.number)
    || format('release manual {0} · {1}', github.ref_name, github.actor) }}

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-dev.[0-9]+']
  workflow_dispatch:
  pull_request: # ensaio quando o próprio workflow muda (dispatch exige o arquivo na branch padrão)
    paths: ['.github/workflows/release.yml', 'Dockerfile']

permissions:
  contents: write # criar a GitHub Release com o imagem.json
  packages: write # publicar no GHCR (write inclui read: instalar @viralabs-dev/brabo-shared)
  id-token: write # cosign keyless (a identidade é o OIDC deste workflow)

env:
  IMAGEM: ghcr.io/viralabs-dev/brabo-web
  TRIVY_VERSION: '0.70.0'
  TRIVY_SHA256: '8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9'

jobs:
  imagem:
    name: Imagem (${{ github.ref_type == 'tag' && 'release' || 'ensaio' }})
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      PUBLICAR: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Vínculos (origem pela tag)
        uses: viralabs-dev/brabo-ci/.github/actions/vinculos@2d9ec1b9a8045d0d35e769d81b4c441264452ebb  # brabo-ci dev, merge da ci#22 (AT-773)
        with:
          destino: |
            Imagem no GHCR|https://github.com/viralabs-dev/brabo-web/pkgs/container/brabo-web
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: A versão
        id: v
        run: |
          set -euo pipefail
          if [ "${PUBLICAR}" = true ]; then echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; else echo "tag=v0.0.0-ensaio" >> "$GITHUB_OUTPUT"; fi

      - name: Token do registry como secret do BuildKit (RN-1039)
        run: |
          umask 077
          printf '//npm.pkg.github.com/:_authToken=%s\n' "${GITHUB_TOKEN}" > "${RUNNER_TEMP}/npmrc"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login no GHCR
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release: empurra (o digest nasce do push). Ensaio: carrega local, sem push.
      - name: Build (e push só na tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: ${{ env.PUBLICAR == 'true' }}
          load: ${{ env.PUBLICAR != 'true' }}
          secret-files: |
            npmrc=${{ runner.temp }}/npmrc
          tags: |
            ${{ env.IMAGEM }}:${{ steps.v.outputs.tag }}
          build-args: |
              VITE_BRABO_VERSION=${{ steps.v.outputs.tag }}
              VITE_BRABO_AMBIENTE=prd

      - name: Instalar o binário do trivy
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          trivy --version

      # Pelo DIGEST na tag (imagem já publicada), ANTES de assinar: reprovada não é assinada.
      # Flags do monorepo; `.trivyignore.yaml` só existe onde o monorepo o aplicava.
      - name: Trivy — HIGH/CRITICAL com correção reprova
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "${PUBLICAR}" = true ]; then alvo="${IMAGEM}@${DIGEST}"; src=remote; else alvo="${IMAGEM}:${TAG}"; src=docker; fi
          ignore=(); [ -f .trivyignore.yaml ] && ignore=(--ignorefile .trivyignore.yaml)
          trivy image --cache-dir /tmp/trivy-cache --image-src "${src}" --no-progress \
            --format table --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            "${ignore[@]}" --exit-code 1 "${alvo}"

      - name: Instalar o cosign
        if: env.PUBLICAR == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Assinar por digest e verificar no mesmo run
        if: env.PUBLICAR == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "${DIGEST}"
          cosign sign --yes "${IMAGEM}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${IMAGEM}@${DIGEST}" > /dev/null
          echo "verificado: ${IMAGEM}@${DIGEST}"

      - name: Gerar o imagem.json
        if: env.PUBLICAR == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          jq -n --arg i "${IMAGEM}" --arg t "${TAG}" --arg d "${DIGEST}" \
            '{imagem:$i,tag:$t,digest:$d}' > imagem.json
          cat imagem.json

      # `-dev.N`: sem Release no GitHub; o brabo-qa lê o digest do artefato (e do GHCR).
      - name: Guardar o imagem.json como artefato (-dev)
        if: env.PUBLICAR == 'true' && contains(github.ref_name, '-dev.')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: imagem-json
          path: imagem.json

      - name: Publicar a Release com o imagem.json
        if: env.PUBLICAR == 'true' && !contains(github.ref_name, '-dev.')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: gh release create "${TAG}" imagem.json --title "${TAG}" --generate-notes --verify-tag
