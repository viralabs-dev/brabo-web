name: readme

# README no esqueleto de 8 seções e bloco "Onde se encaixa" em dia (AT-826). Reutilizáveis do brabo-ci.
# NÃO são checks obrigatórios.
run-name: "readme ← #${{ github.event.pull_request.number }} (${{ github.head_ref }})"

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  esqueleto:
    uses: viralabs-dev/brabo-ci/.github/workflows/readme-esqueleto.yml@54dc896bbcd3cb5cbb6f0717825031f24152b8f0  # v1.4.0-dev.13
    with:
      ci_ref: 54dc896bbcd3cb5cbb6f0717825031f24152b8f0  # v1.4.0-dev.13

  mapa:
    uses: viralabs-dev/brabo-ci/.github/workflows/mapa-alinhado.yml@54dc896bbcd3cb5cbb6f0717825031f24152b8f0  # v1.4.0-dev.13
    with:
      ci_ref: 54dc896bbcd3cb5cbb6f0717825031f24152b8f0  # v1.4.0-dev.13
