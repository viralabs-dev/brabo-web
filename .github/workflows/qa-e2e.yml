name: qa-e2e

# Liga o E2E do brabo-qa nas PRs para a main (portão da main, AT-765).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  qa-e2e:
    uses: viralabs-dev/brabo-ci/.github/workflows/qa-e2e-gatilho.yml@46d66150926054d605baaa3634ab9af7864cd424  # brabo-ci#10 (AT-765)
    with:
      ci_ref: 46d66150926054d605baaa3634ab9af7864cd424  # brabo-ci#10 (AT-765)
    secrets:
      APP_ID: ${{ secrets.BRABO_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.BRABO_APP_PRIVATE_KEY }}
