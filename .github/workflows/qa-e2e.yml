name: qa-e2e

# Liga o brabo-qa nas PRs: base main = `E2E do brabo-qa` (portão da main, AT-765); base dev = `Regressivo do
# brabo-qa` (AT-769), que atesta e NUNCA é exigido.
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  qa-e2e:
    uses: viralabs-dev/brabo-ci/.github/workflows/qa-e2e-gatilho.yml@13f3697aaf3e4a151637755babb58422a44db303  # brabo-ci#17 (AT-765)
    with:
      ci_ref: 13f3697aaf3e4a151637755babb58422a44db303  # brabo-ci#17 (AT-765)
    secrets:
      APP_ID: ${{ secrets.BRABO_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.BRABO_APP_PRIVATE_KEY }}
