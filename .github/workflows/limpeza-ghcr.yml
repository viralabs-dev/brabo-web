name: limpeza-ghcr

# Limpeza das versões da imagem `ghcr.io/viralabs-dev/brabo-web` no GHCR (AT-765).
# - PR fechada: apaga a versão `sha-<12 do head>` (imagem do hotfix).
# - Diário: guarda as 10 tags `-dev.N` mais novas e apaga as demais.
# Nunca apaga versão que tenha tag `vX.Y.Z` sem sufixo.
on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  packages: write # apagar versões do pacote (o pacote precisa permitir este repo em "Manage Actions access")

env:
  PACOTE: brabo-web
  GH_TOKEN: ${{ github.token }}

jobs:
  sha-da-pr:
    name: Apagar sha- da PR fechada
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - env:
          TAG_SHA: sha-${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          tag="${TAG_SHA:0:16}"
          gh api --paginate "orgs/viralabs-dev/packages/container/${PACOTE}/versions" \
            | jq -r --arg t "$tag" '.[] | select(any(.metadata.container.tags[]; . == $t)) | select(all(.metadata.container.tags[]; test("^v[0-9]+\\.[0-9]+\\.[0-9]+$") | not)) | .id' \
            | while read -r id; do
                echo "apagando versão ${id} (${tag})"
                gh api -X DELETE "orgs/viralabs-dev/packages/container/${PACOTE}/versions/${id}"
              done

  dev-antigas:
    name: Guardar só as 10 -dev mais novas
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          set -euo pipefail
          gh api --paginate "orgs/viralabs-dev/packages/container/${PACOTE}/versions" \
            | jq -rs 'add
                | map(select(any(.metadata.container.tags[]; test("^v[0-9]+\\.[0-9]+\\.[0-9]+-dev\\.[0-9]+$"))
                       and all(.metadata.container.tags[]; test("^v[0-9]+\\.[0-9]+\\.[0-9]+$") | not)))
                | sort_by(.created_at) | reverse | .[10:][] | .id' \
            | while read -r id; do
                echo "apagando versão ${id}"
                gh api -X DELETE "orgs/viralabs-dev/packages/container/${PACOTE}/versions/${id}"
              done
