name: readme

# README no esqueleto de 8 seções e bloco "Onde se encaixa" em dia (AT-826). Reutilizáveis do brabo-ci.
# NÃO são checks obrigatórios.
run-name: "readme ← #${{ github.event.pull_request.number }} (${{ github.head_ref }})"

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  esqueleto:
    uses: viralabs-dev/brabo-ci/.github/workflows/readme-esqueleto.yml@6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17
    with:
      ci_ref: 6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17

  mapa:
    uses: viralabs-dev/brabo-ci/.github/workflows/mapa-alinhado.yml@6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17
    with:
      ci_ref: 6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17
