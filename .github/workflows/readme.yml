name: readme

# README no esqueleto de 8 seções e bloco "Onde se encaixa" em dia (AT-826). Reutilizáveis do brabo-ci.
# NÃO são checks obrigatórios.
run-name: "readme ← #${{ github.event.pull_request.number }} (${{ github.head_ref }})"

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  esqueleto:
    uses: viralabs-dev/brabo-ci/.github/workflows/readme-esqueleto.yml@e212b715d669c0388ce3bb9526278f1820f094c1  # v1.6.0
    with:
      ci_ref: e212b715d669c0388ce3bb9526278f1820f094c1  # v1.6.0

  mapa:
    uses: viralabs-dev/brabo-ci/.github/workflows/mapa-alinhado.yml@e212b715d669c0388ce3bb9526278f1820f094c1  # v1.6.0
    with:
      ci_ref: e212b715d669c0388ce3bb9526278f1820f094c1  # v1.6.0
