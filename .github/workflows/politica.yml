name: politica

# Política de PR do Brabo, via workflows reutilizáveis do brabo-ci.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-police:
    uses: viralabs-dev/brabo-ci/.github/workflows/pr-police.yml@242598dff5b306bfc7c2f71f28317826538f887a  # brabo-ci#2
    with:
      ci_ref: 242598dff5b306bfc7c2f71f28317826538f887a  # brabo-ci#2
  escada:
    uses: viralabs-dev/brabo-ci/.github/workflows/approval-ladder.yml@242598dff5b306bfc7c2f71f28317826538f887a  # brabo-ci#2
    with:
      ci_ref: 242598dff5b306bfc7c2f71f28317826538f887a  # brabo-ci#2
