name: carimbo

# Carimba a tag do estágio a cada push em dev/main (tag-release do brabo-ci, AT-704).
# A 1ª tag final na `main` sai `v1.0.0`: o ciclo inicial traz uma PR `breaking/` (MAJOR
# sobre a base 0.0.0 de `proximaVersao`, coberto em brabo-ci `version.spec.ts`).
#
# BOT_TOKEN: o token do App (create-github-app-token) não atravessa jobs (é mascarado),
# então não dá para passá-lo ao reutilizável. Sem ele a tag nasce pelo GITHUB_TOKEN e NÃO
# dispara o `release.yml`; o job `publicar` fecha isso despachando-o na própria tag.
# Hotfix exige o BOT_TOKEN (lacuna declarada, ver a PR).
on:
  push:
    branches: [dev, main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  carimbar:
    uses: viralabs-dev/brabo-ci/.github/workflows/tag-release.yml@236dc29d9e64a95ba278bd2ec1109940ce3d6e20  # v1.0.0
    with:
      ci_ref: 236dc29d9e64a95ba278bd2ec1109940ce3d6e20

  publicar:
    name: Despachar o release da tag final
    needs: carimbar
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Despachar release.yml na tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          tag="$(git tag --points-at "${GITHUB_SHA}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [ -z "${tag}" ]; then echo "sem tag final neste commit"; exit 0; fi
          gh workflow run release.yml --ref "${tag}"
          echo "release despachado em ${tag}"
